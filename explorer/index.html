<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memero Block Explorer</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png" />
  <style>
    :root {
      --bg: #000000;
      --surface: #050a05;
      --border: #102010;
      --text: #eaffea;
      --muted: #6a8f6a;
      --green: #01ff02;
      --green-glow: rgba(1, 255, 2, 0.55);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      background-image: radial-gradient(ellipse at 50% 0%, #04180a 0%, #000000 60%);
      color: var(--text);
      font-family: "SF Mono", "JetBrains Mono", "Fira Code", ui-monospace, Menlo, Consolas, monospace;
      line-height: 1.6;
      min-height: 100vh;
    }
    a { color: var(--green); text-decoration: none; }
    a:hover { text-shadow: 0 0 8px var(--green-glow); }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 1.5rem; }
    header {
      display: flex; align-items: center; gap: 0.9rem; flex-wrap: wrap;
      margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.9rem;
    }
    .logo { height: 46px; width: 46px; border-radius: 8px; filter: drop-shadow(0 0 10px var(--green-glow)); }
    .headtxt { margin-right: auto; }
    h1 { font-size: 1.35rem; color: var(--green); letter-spacing: 0.04em; }
    h1 .tick { color: var(--muted); font-size: 0.9rem; font-weight: normal; }

    .muted { color: var(--muted); }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 1.25rem; margin-bottom: 1.25rem;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; }
    .stat { text-align: center; padding: 0.6rem; }
    .stat .num { font-size: 1.35rem; font-weight: 700; color: var(--green); text-shadow: 0 0 8px var(--green-glow); }
    .stat .lbl { color: var(--muted); font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase; }

    table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
    th, td { text-align: left; padding: 0.5rem 0.7rem; border-bottom: 1px solid var(--border); }
    th { color: var(--green); font-weight: 600; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.08em; }
    tr:last-child td, tr:last-child th { border-bottom: none; }
    td.hash { font-family: inherit; word-break: break-all; }

    .pill {
      display: inline-block; background: rgba(1,255,2,0.08);
      border: 1px solid var(--green); color: var(--green);
      border-radius: 999px; padding: 0.05rem 0.7rem; font-size: 0.72rem;
      font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
    }

    input[type=text] {
      background: #020602; border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; padding: 0.6rem 0.85rem; width: 100%; font-family: inherit;
      font-size: 0.9rem;
    }
    input[type=text]:focus { outline: none; border-color: var(--green); box-shadow: 0 0 12px var(--green-glow); }
    button {
      background: var(--green); color: #000; border: none; border-radius: 8px;
      padding: 0.6rem 1.2rem; cursor: pointer; font-weight: 700; font-family: inherit;
      letter-spacing: 0.05em;
    }
    button:hover { box-shadow: 0 0 16px var(--green-glow); }
    .search { display: flex; gap: 0.6rem; }
    .search input { flex: 1; }

    pre {
      background: #020602; border: 1px solid var(--border); border-radius: 8px;
      padding: 1rem; overflow-x: auto; font-size: 0.8em; color: #b8ffb8;
    }
    .footer { text-align: center; color: var(--muted); font-size: 0.78rem; margin-top: 2rem; }
    .mono { font-family: inherit; }
    h2 { font-size: 1.05rem; margin-bottom: 0.9rem; color: var(--green); letter-spacing: 0.05em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img class="logo" src="assets/logo.png" alt="Memero" />
      <div class="headtxt">
        <h1>Memero <span class="tick">· Block Explorer</span></h1>
      </div>
      <span class="pill" id="nettype">—</span>
    </header>

    <div class="card">
      <div class="grid" id="stats">
        <div class="stat"><div class="num" id="s-height">—</div><div class="lbl">Height</div></div>
        <div class="stat"><div class="num" id="s-diff">—</div><div class="lbl">Difficulty</div></div>
        <div class="stat"><div class="num" id="s-target">—</div><div class="lbl">Target (s)</div></div>
        <div class="stat"><div class="num" id="s-txcount">—</div><div class="lbl">Tx count</div></div>
        <div class="stat"><div class="num" id="s-supply">—</div><div class="lbl">Emitted</div></div>
      </div>
    </div>

    <div class="card">
      <div class="search">
        <input type="text" id="search" placeholder="Search by block height, block hash, or tx hash…" onkeydown="if(event.key==='Enter')doSearch()" />
        <button onclick="doSearch()">Search</button>
      </div>
    </div>

    <div class="card" id="detail" style="display:none;">
      <h2 id="detail-title">Details</h2>
      <table id="detail-table"></table>
      <pre id="detail-pre" style="display:none;"></pre>
    </div>

    <div class="card">
      <h2>Latest blocks</h2>
      <table>
        <thead><tr><th>Height</th><th>Hash</th><th>Reward (MEM)</th><th>Tx</th><th>Size</th></tr></thead>
        <tbody id="blocks-tbody"><tr><td colspan="5" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>

    <div class="footer">
      <p>rpc <span id="version" class="mono">—</span> · top hash <span id="top-hash" class="mono">—</span></p>
      <p style="margin-top:0.4rem;"><a href="https://memero.lol">memero.lol</a> · <a href="https://github.com/memerocoin/memero">github.com/memerocoin/memero</a></p>
    </div>
  </div>

  <script>
    const COIN = 1e11;
    let info = null;

    async function rpc(method, params = {}) {
      const res = await fetch('/rpc', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jsonrpc: '2.0', id: '0', method, params })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message || 'rpc error');
      return data.result;
    }

    function formatMEM(atomic) {
      if (atomic === undefined || atomic === null) return '—';
      const n = Number(atomic) / COIN;
      return n >= 100000 ? (n/1e6).toFixed(2) + 'M MEM' : n.toFixed(6) + ' MEM';
    }

    function shortHash(h) { return h ? h.slice(0, 16) + '…' + h.slice(-8) : '—'; }

    async function refresh() {
      try {
        info = await rpc('get_info');
        document.getElementById('s-height').textContent = info.height;
        document.getElementById('s-diff').textContent = formatNum(info.difficulty);
        document.getElementById('s-target').textContent = info.target;
        document.getElementById('s-txcount').textContent = info.tx_count;
        document.getElementById('s-supply').textContent = formatEmitted(info);
        document.getElementById('nettype').textContent = info.mainnet ? 'mainnet' : (info.testnet ? 'testnet' : 'stagenet');
        document.getElementById('version').textContent = info.version;
        document.getElementById('top-hash').textContent = shortHash(info.top_block_hash);
        await loadBlocks(info.height);
      } catch (e) {
        document.getElementById('blocks-tbody').innerHTML = '<tr><td colspan="5" class="muted">Error: ' + e.message + '</td></tr>';
      }
    }

    function formatNum(n) {
      if (n === undefined || n === null) return '—';
      if (n >= 1e9) return (n/1e9).toFixed(2) + 'G';
      if (n >= 1e6) return (n/1e6).toFixed(2) + 'M';
      if (n >= 1e3) return (n/1e3).toFixed(2) + 'K';
      return String(n);
    }

    function formatEmitted(info) {
      if (info.height < 2) return formatNum(3509521484375);
      return info.height + ' blk';
    }

    async function loadBlocks(height) {
      const tbody = document.getElementById('blocks-tbody');
      const start = Math.max(0, height - 9);
      let rows = '';
      for (let h = height; h >= start; h--) {
        try {
          const bh = await rpc('get_block_header_by_height', { height: h });
          const b = bh.block_header;
          rows += '<tr>' +
            '<td><a href="javascript:showBlock(' + b.height + ')">' + b.height + '</a></td>' +
            '<td class="hash"><a href="javascript:showBlock(' + b.height + ')">' + shortHash(b.hash) + '</a></td>' +
            '<td>' + formatMEM(b.reward) + '</td>' +
            '<td>' + b.num_txes + '</td>' +
            '<td>' + (b.block_weight || b.block_size || 0) + '</td>' +
          '</tr>';
        } catch (e) { rows += '<tr><td colspan="5" class="muted">block ' + h + ' unavailable</td></tr>'; }
      }
      tbody.innerHTML = rows;
    }

    async function showBlock(height) {
      const detail = document.getElementById('detail');
      const table = document.getElementById('detail-table');
      const pre = document.getElementById('detail-pre');
      document.getElementById('detail-title').textContent = 'Block #' + height;
      try {
        const bh = await rpc('get_block_header_by_height', { height });
        const b = bh.block_header;
        const rows = [
          ['Height', b.height], ['Hash', b.hash], ['Previous hash', b.prev_hash],
          ['Miner tx hash', b.miner_tx_hash], ['Reward', formatMEM(b.reward)],
          ['Difficulty', b.difficulty], ['Cumulative difficulty', b.cumulative_difficulty],
          ['Timestamp', new Date(b.timestamp * 1000).toISOString()],
          ['Tx count', b.num_txes], ['Block weight', b.block_weight + ' (' + b.block_size + ' bytes)'],
          ['Major/minor version', b.major_version + ' / ' + b.minor_version],
          ['Nonce', b.nonce],
        ];
        table.innerHTML = '';
        for (const [k, v] of rows) {
          table.innerHTML += '<tr><th>' + k + '</th><td class="hash">' + v + '</td></tr>';
        }
        pre.style.display = 'none';
        detail.style.display = 'block';
        detail.scrollIntoView({ behavior: 'smooth' });
      } catch (e) { alert('Error: ' + e.message); }
    }

    async function doSearch() {
      const q = document.getElementById('search').value.trim();
      if (!q) return;
      if (/^\d+$/.test(q)) { showBlock(parseInt(q, 10)); return; }
      try {
        const r = await rpc('get_block_header_by_hash', { hash: q });
        showBlock(r.block_header.height);
        return;
      } catch (e) {}
      try {
        const tx = await rpc('get_transactions', { txs_hashes: [q] });
        if (tx.txs && tx.txs[0]) {
          showBlock(tx.txs[0].block_height);
          return;
        }
      } catch (e) {}
      alert('Not found: ' + q);
    }

    refresh();
    setInterval(refresh, 15000);
  </script>
</body>
</html>
