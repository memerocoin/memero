<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memero Block Explorer</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png" />
  <style>
    :root {
      --bg: #0e0e12; --surface: #181820; --border: #2a2a38;
      --text: #e8e8f0; --muted: #9a9ab0; --accent: #7c5cff; --accent2: #4dd0a0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; }
    a { color: var(--accent2); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 1.5rem; }
    header { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; }
    .logo { height: 44px; width: 44px; border-radius: 8px; }
    .headtxt { margin-right: auto; }
    h1 { font-size: 1.5rem; }
    h1 .tick { color: var(--accent2); font-size: 1rem; font-weight: normal; }
    .muted { color: var(--muted); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; }
    .stat { text-align: center; }
    .stat .num { font-size: 1.4rem; font-weight: 700; }
    .stat .lbl { color: var(--muted); font-size: 0.8rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 500; }
    td.hash { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.85em; }
    .pill { display: inline-block; background: #7c5cff22; border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 0.05rem 0.6rem; font-size: 0.75rem; }
    input[type=text], input[type=number] {
      background: #00000040; border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; padding: 0.5rem 0.75rem; width: 100%; font-family: ui-monospace, monospace;
    }
    button {
      background: var(--accent); color: white; border: none; border-radius: 8px;
      padding: 0.5rem 1rem; cursor: pointer; font-weight: 600;
    }
    button:hover { opacity: 0.9; }
    .search { display: flex; gap: 0.5rem; }
    .search input { flex: 1; }
    pre { background: #00000060; border: 1px solid var(--border); border-radius: 8px; padding: 1rem; overflow-x: auto; font-size: 0.8em; }
    .footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 2rem; }
    .mono { font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img class="logo" src="assets/logo.png" alt="Memero" />
      <h1>Memero <span class="tick">MEM · Block Explorer</span></h1>
      <span class="pill" id="nettype">—</span>
    </header>

    <div class="card">
      <div class="grid" id="stats">
        <div class="stat"><div class="num" id="s-height">—</div><div class="lbl">Height</div></div>
        <div class="stat"><div class="num" id="s-diff">—</div><div class="lbl">Difficulty</div></div>
        <div class="stat"><div class="num" id="s-target">—</div><div class="lbl">Target (s)</div></div>
        <div class="stat"><div class="num" id="s-txcount">—</div><div class="lbl">Tx count</div></div>
        <div class="stat"><div class="num" id="s-peers">—</div><div class="lbl">Peers</div></div>
      </div>
    </div>

    <div class="card">
      <div class="search">
        <input type="text" id="search" placeholder="Search by block height, block hash, or tx hash…" />
        <button onclick="doSearch()">Search</button>
      </div>
    </div>

    <div class="card" id="detail" style="display:none;">
      <h2 id="detail-title" style="margin-bottom:0.75rem;">Details</h2>
      <table id="detail-table"></table>
      <pre id="detail-pre" style="display:none;"></pre>
    </div>

    <div class="card">
      <h2 style="margin-bottom:0.75rem;">Latest blocks</h2>
      <table>
        <thead><tr><th>Height</th><th>Hash</th><th>Reward (MEM)</th><th>Tx count</th><th>Size</th></tr></thead>
        <tbody id="blocks-tbody"><tr><td colspan="5" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>

    <div class="footer">
      <p>rpc <span id="version" class="mono">—</span> · top hash <span id="top-hash" class="mono">—</span></p>
      <p><a href="https://github.com/memerocoin/memero">github.com/memerocoin/memero</a></p>
    </div>
  </div>

  <script>
    const COIN = 1e11;
    let info = null;

    async function rpc(method, params = {}) {
      const res = await fetch('/rpc', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jsonrpc: '2.0', id: '0', method, params })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message || 'rpc error');
      return data.result;
    }

    function formatMEM(atomic) {
      if (atomic === undefined || atomic === null) return '—';
      return (Number(atomic) / COIN).toFixed(6) + ' MEM';
    }

    async function refresh() {
      try {
        info = await rpc('get_info');
        document.getElementById('s-height').textContent = info.height;
        document.getElementById('s-diff').textContent = info.difficulty;
        document.getElementById('s-target').textContent = info.target;
        document.getElementById('s-txcount').textContent = info.tx_count;
        document.getElementById('s-peers').textContent = (info.incoming_connections_count || 0) + (info.outgoing_connections_count || 0);
        document.getElementById('nettype').textContent = info.mainnet ? 'mainnet' : (info.testnet ? 'testnet' : 'stagenet');
        document.getElementById('version').textContent = info.version;
        document.getElementById('top-hash').textContent = info.top_block_hash;
        await loadBlocks(info.height);
      } catch (e) {
        document.getElementById('blocks-tbody').innerHTML = '<tr><td colspan="5" class="muted">Error: ' + e.message + '</td></tr>';
      }
    }

    async function loadBlocks(height) {
      const tbody = document.getElementById('blocks-tbody');
      const start = Math.max(0, height - 9);
      let rows = '';
      for (let h = height; h >= start; h--) {
        try {
          const bh = await rpc('get_block_header_by_height', { height: h });
          const b = bh.block_header;
          rows += '<tr>' +
            '<td><a href="javascript:showBlock(' + b.height + ')">' + b.height + '</a></td>' +
            '<td class="hash">' + b.hash.slice(0, 32) + '…</td>' +
            '<td>' + formatMEM(b.reward) + '</td>' +
            '<td>' + b.num_txes + '</td>' +
            '<td>' + (b.block_weight || b.block_size || 0) + '</td>' +
          '</tr>';
        } catch (e) { rows += '<tr><td colspan="5" class="muted">block ' + h + ' unavailable</td></tr>'; }
      }
      tbody.innerHTML = rows;
    }

    async function showBlock(height) {
      const detail = document.getElementById('detail');
      const table = document.getElementById('detail-table');
      const pre = document.getElementById('detail-pre');
      document.getElementById('detail-title').textContent = 'Block #' + height;
      try {
        const bh = await rpc('get_block_header_by_height', { height });
        const b = bh.block_header;
        table.innerHTML = '';
        const rows = [
          ['Height', b.height], ['Hash', b.hash], ['Previous hash', b.prev_hash],
          ['Miner tx hash', b.miner_tx_hash], ['Reward', formatMEM(b.reward)],
          ['Difficulty', b.difficulty], ['Cumulative difficulty', b.cumulative_difficulty],
          ['Timestamp', new Date(b.timestamp * 1000).toISOString()],
          ['Tx count', b.num_txes], ['Block weight', b.block_weight + ' (' + b.block_size + ' bytes)'],
          ['Major/minor version', b.major_version + ' / ' + b.minor_version],
          ['Nonce', b.nonce],
        ];
        for (const [k, v] of rows) {
          table.innerHTML += '<tr><th>' + k + '</th><td class="hash">' + v + '</td></tr>';
        }
        pre.style.display = 'none';
        detail.style.display = 'block';
        detail.scrollIntoView({ behavior: 'smooth' });
      } catch (e) { alert('Error: ' + e.message); }
    }

    async function doSearch() {
      const q = document.getElementById('search').value.trim();
      if (!q) return;
      // try height
      if (/^\d+$/.test(q)) { showBlock(parseInt(q, 10)); return; }
      // try block hash
      try {
        const r = await rpc('get_block_header_by_hash', { hash: q });
        showBlock(r.block_header.height);
        return;
      } catch (e) {}
      // try tx hash -> find block height
      try {
        const tx = await rpc('get_transactions', { txs_hashes: [q] });
        if (tx.txs && tx.txs[0]) {
          alert('Transaction found in block #' + tx.txs[0].block_height);
          showBlock(tx.txs[0].block_height);
          return;
        }
      } catch (e) {}
      alert('Not found: ' + q);
    }

    refresh();
    setInterval(refresh, 15000);
  </script>
</body>
</html>
